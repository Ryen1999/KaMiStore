server:
  port: 8080

spring:
  application:
    name: shop-gateway
  profiles:
    active: dev

  # ==================== Nacos Config ====================
  cloud:
    nacos:
      # discovery
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:124.223.32.169:8848}
        namespace: ${nacos.config.namespace}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      # config center
      config:
        server-addr: ${NACOS_SERVER_ADDR:124.223.32.169:8848}
        namespace: ${nacos.config.namespace}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        shared-configs:
          - data-id: common-application.yaml
            group: ${NACOS_GROUP:DEFAULT_GROUP}
            refresh: true
        refresh-enabled: true

# ==================== Logging Config ====================
logging:
  level:
    com.shop.gateway: debug
    org.springframework.cloud.gateway: info

# ==================== Actuator Config ====================
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

# -------- dev --------
---
spring:
  config:
    activate:
      on-profile: dev
nacos:
  config:
    namespace: b9c38ab4-538b-4708-968c-631138d4f1bd

# -------- prod --------
---
spring:
  config:
    activate:
      on-profile: prod
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        namespace: 7ab5a957-ed98-411a-8deb-ab0b84dde607
      config:
        server-addr: nacos:8848
        namespace: 7ab5a957-ed98-411a-8deb-ab0b84dde607

# -------- default dev nacos namespace --------
nacos:
  config:
    namespace: b9c38ab4-538b-4708-968c-631138d4f1bd
