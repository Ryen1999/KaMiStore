server:
  port: 8083

spring:
  application:
    name: shop-product
  profiles:
    active: dev

  # ==================== Nacos配置 ====================
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:124.223.32.169:8848}
        namespace: ${nacos.config.namespace}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
      config:
        server-addr: ${NACOS_SERVER_ADDR:124.223.32.169:8848}
        namespace: ${nacos.config.namespace}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml

  # ==================== 数据源配置 ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:124.223.32.169}:3306/shop_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:15151112063Gw@}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  # ==================== Redis配置 ====================
  redis:
    host: ${REDIS_HOST:124.223.32.169}
    port: 6379
    password: ${REDIS_PASSWORD:ShopRedis@2026!}
    database: 0
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

# ==================== Sa-Token配置 ====================
sa-token:
  token-name: Authorization
  timeout: 2592000
  activity-timeout: 86400
  is-concurrent: true
  token-style: uuid
  is-read-header: true
  is-read-cookie: false
  token-prefix: Bearer

# ==================== MyBatis-Plus配置 ====================
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ==================== 日志配置 ====================
logging:
  level:
    com.shop: debug

# -------- dev 环境（本地开发）--------
---
spring:
  config:
    activate:
      on-profile: dev
nacos:
  config:
    namespace: b9c38ab4-538b-4708-968c-631138d4f1bd

# -------- prod 环境（Docker）--------
---
spring:
  config:
    activate:
      on-profile: prod
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
        namespace: 7ab5a957-ed98-411a-8deb-ab0b84dde607
      config:
        server-addr: nacos:8848
        namespace: 7ab5a957-ed98-411a-8deb-ab0b84dde607
  datasource:
    url: jdbc:mysql://mysql:3306/shop_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
  redis:
    host: redis
